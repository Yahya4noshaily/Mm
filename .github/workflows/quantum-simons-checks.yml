name: Quantum Simons regression tests
on:
  push:
    branches: [quantum-simons-site-v1]
  workflow_dispatch:

jobs:
  test-paper-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quantum Simons source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paper-trade journal regression tests
        run: python -m unittest discover -s tests -v
      - name: Run browser notification regression tests
        run: node --test tests/test_alert_policy.cjs
